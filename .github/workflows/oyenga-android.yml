name: OYENGA — APK Android

# Compile l'application native OYENGA et publie un APK de debug installable.
# Les runners GitHub disposent du SDK Android, ce que l'environnement de
# développement n'a pas : c'est ici que la compilation fait autorité.

on:
  push:
    branches: [claude/projet-oyenga-w7hb86]
    paths:
      - 'oyenga-android/**'
      - '.github/workflows/oyenga-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Compiler l'APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oyenga-android

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compiler l'APK de debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Publier l'APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: oyenga-debug-apk
          path: oyenga-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publier les rapports de test en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            oyenga-android/app/build/reports/
            oyenga-android/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
