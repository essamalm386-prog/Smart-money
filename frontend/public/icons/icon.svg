<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Smart Money">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#111826"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#1e293b" stroke-width="4"/>
  <!-- rising chart line -->
  <polyline points="96,360 176,300 240,332 320,208 416,152"
    fill="none" stroke="url(#line)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="416" cy="152" r="26" fill="#10b981"/>
  <!-- baseline bars -->
  <rect x="112" y="392" width="34" height="40" rx="8" fill="#1e293b"/>
  <rect x="176" y="380" width="34" height="52" rx="8" fill="#233043"/>
  <rect x="240" y="368" width="34" height="64" rx="8" fill="#2b3a52"/>
  <rect x="304" y="352" width="34" height="80" rx="8" fill="#f59e0b"/>
  <rect x="368" y="336" width="34" height="96" rx="8" fill="#10b981"/>
</svg>
