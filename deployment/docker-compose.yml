services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: smartmoney-backend
    env_file:
      - ../backend/.env
    environment:
      - DATABASE_URL=sqlite:////data/smart_money.db
    volumes:
      - backend_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: smartmoney-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  backend_data:
